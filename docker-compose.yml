# ChessBlizzard en local con Docker: la app en http://localhost:3000 y PostgreSQL 16.
#
#   docker compose up --build        todo (la app aplica las migraciones al arrancar)
#   docker compose up -d db          solo la base de datos, para `npm run dev` (ver .env.example)
#   docker compose down              parar (los datos siguen en el volumen pgdata)
#   docker compose down -v           parar y borrar los datos
#
# Las credenciales son solo para uso local.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chessblizzard
      POSTGRES_PASSWORD: chessblizzard
      POSTGRES_DB: chessblizzard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo accesible desde este equipo.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessblizzard -d chessblizzard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chessblizzard:chessblizzard@db:5432/chessblizzard
      # http://localhost no es HTTPS: la cookie de sesión no puede llevar Secure.
      COOKIE_SECURE: "false"
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
