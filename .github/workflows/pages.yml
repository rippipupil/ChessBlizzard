name: GitHub Pages

# Publica la versión estática de la web (sin servidor, en modo invitado) en la rama gh-pages
# cada vez que cambia la rama principal del repositorio. GitHub Pages la sirve en
# https://rippipupil.github.io/ChessBlizzard/ (Settings › Pages: "Deploy from a branch",
# rama gh-pages y carpeta raíz).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Si llegan dos pushes seguidos, se publica solo el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Compilar y publicar
    # Solo la rama principal, se llame como se llame.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      # La rama gh-pages solo guarda la última versión publicada (un único commit).
      - name: Publicar en la rama gh-pages
        working-directory: client/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
