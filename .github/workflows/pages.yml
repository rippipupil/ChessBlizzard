name: GitHub Pages

# Publica la versión estática de la web (sin servidor, en modo invitado) en GitHub Pages
# cada vez que cambia la rama principal: https://rippipupil.github.io/ChessBlizzard/
# El paso "Configurar Pages" activa GitHub Pages en el repositorio si aún no lo está, así
# que no hace falta tocar nada en Settings › Pages.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, las publicaciones van una detrás de otra (no se cancela
# una publicación a medias).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar
    # Solo la rama principal, se llame como se llame.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
