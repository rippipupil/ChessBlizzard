name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-server:
    name: shared y server (typecheck y tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chessblizzard
          POSTGRES_PASSWORD: chessblizzard
          POSTGRES_DB: chessblizzard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chessblizzard -d chessblizzard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Con esta variable, los tests del servidor usan este PostgreSQL en vez de arrancar uno.
      TEST_DATABASE_URL: postgres://chessblizzard:chessblizzard@localhost:5432/chessblizzard_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w shared
      - run: npm test -w shared
      - run: npm run typecheck -w server
      - run: npm test -w server

  client:
    name: client (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w client
